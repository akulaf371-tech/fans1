<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@TITLE@ — FANS1</title>
<meta name="description" content="@EXCERPT@">
<meta property="og:type" content="article">
<meta property="og:title" content="@TITLE@ — FANS1">
<meta property="og:description" content="@EXCERPT@">
<meta property="og:image" content="@HERO_IMG@">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar__in">
    <a class="logo" href="/">FAN<span>S1</span></a>
    <span class="logo-sub">фанатский блог о Формуле-1</span>
    <a class="rss-link" href="/feed.xml" title="RSS-лента">RSS</a>
  </div>
</header>
<main class="wrap">
<article class="post">
  <nav class="crumbs"><a href="/">&larr; Все посты</a></nav>
  <time class="post__date">@DATE_RU@</time>
  <h1 class="post__title">@TITLE@</h1>
  <div class="post__hero">@HERO@</div>
  <div class="post__content">
    @BODY@
  </div>
  <div class="gallery">@GALLERY@</div>
  <p class="post__updated">@UPDATED@</p>
</article>
</main>
<footer class="footer wrap">FANS1 — фанатский блог о Формуле-1 · сделано на Vercel</footer>
<script src="/assets/app.js" defer></script>
</body>
</html>
